[project]
name = "as-platform"
version = "0.1.0"
description = "Shared platform skeleton for the third-party IMS/SIP Application Server instances"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dolan Shu", email = "dolan.d.shu@gmail.com" }]
maintainers = [{ name = "Dolan Shu", email = "dolan.d.shu@gmail.com" }]
keywords = ["sip", "ims", "b2bua", "application-server", "platform"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Communications :: Telephony",
]

# One sippy (ADR-0009 decision 1): the library and its reference implementation share the
# same pinned stack, because the sippy adapter boundary moves into this package. The pin
# must not be widened — two sippy versions in one interpreter would break the in-process
# tests.
#
# pydantic is a runtime dependency because the moved ``hop.NextHop`` value object is a
# pydantic model, exactly as it is in the reference implementation.
#
# fastapi and uvicorn are runtime dependencies because the moved ``internal_api`` shell
# serves the console surface as a FastAPI application on a daemon uvicorn thread (ADR-0002),
# at the same versions the reference implementation pins.
dependencies = [
  "sippy==2.4.2",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[dependency-groups]
dev = [
  "mypy>=1.9",
  "pytest>=8.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/as_platform"]

# The tooling below is equivalent to the reference implementation's: the library carries its
# own gate, so moved code is formatted, linted and type-checked where it lives. The suite
# lives in tests/, the gate in the Makefile and .github/workflows/ci.yml, and the three
# library-standard documents (API reference, integration guide, compatibility matrix) in
# docs/.
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "A",   # builtins shadowing
  "B",   # bugbear
  "C4",  # comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8 naming
  "SIM", # simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  "D203", # 1 blank line required before class docstring (conflicts with D211)
  "D213", # multi-line summary should start at the second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D102", "D104"]
# The observability package owns a module named ``logging``, which shadows the standard
# library builtin (A001) and the standard library module (A005). The shadowing is deliberate
# and every import of it is package-absolute.
"src/as_platform/observability/logging.py" = ["A001", "A005"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["as_platform"]
explicit_package_bases = true
warn_unused_configs = false
warn_redundant_casts = true
warn_return_any = true
strict_optional = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = []

# sippy ships without type information; it is confined to the sippy adapter.
[[tool.mypy.overrides]]
module = ["sippy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis", "redis.*"]
ignore_missing_imports = true
